[project]
name = "neuralsignal"
version = "0.1.0"
description = "Neural Signal ML: decoding motor imagery from EEG and hand velocity from motor-cortex spikes"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11,<1.14",
    "scikit-learn>=1.4,<1.6",
    "torch==2.2.2",
    "pynwb>=2.6",
    "h5py>=3.10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "pandas>=2.1,<2.3",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neuralsignal = "neuralsignal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuralsignal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
